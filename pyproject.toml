[project]
name = "dorsal"
version = "2.0.0"
description = "Dorsal: an AI cash-flow copilot for small businesses (2026 Shenzhen FinTechathon, Topic E)"
requires-python = ">=3.10"
authors = [{name = "Team Dorsal"}]
dependencies = ["numpy>=1.26", "pyyaml>=6.0", "fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6", "httpx>=0.27"]

[project.optional-dependencies]
llm = ["anthropic>=0.40", "openai>=1.40"]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
